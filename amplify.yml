version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -E '^(SUPABASE_URL|SUPABASE_SECRET_KEY|LISTENER_SUPABASE_URL|LISTENER_SUPABASE_ANON_KEY|WHITELIST_EMAILS|WHITELIST_DOMAINS|EDITOR_EMAILS|VISO_URL|NOISE_API_URL|WBGT_API_URL|DEFAULT_LAMBDA_URL_SEND|DEFAULT_LAMBDA_URL_REPLY|DEFAULT_LAMBDA_URL_IMAGE|ONEMAP_TOKEN|NEXT_PUBLIC_|AWS_BRANCH=|AWS_COMMIT_ID=)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
