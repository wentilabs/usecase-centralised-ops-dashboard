# GENERATED from lib/openapi.ts — do not edit by hand. Run `npm run openapi`.
openapi: 3.1.0
info:
  title: HALO — Centralised Services control surface
  version: 0.1.0
  summary: Read and change the live configuration of six centralised alerting services.
  description: |-
    HALO is the configuration control surface for the WBGT, Noise, Haze, Lightning, Ailytics and
    Subcon Activities services. Every service reads its configuration from Postgres on a cron, so a
    write through this API changes real behaviour on the next tick — messages sent to real WhatsApp
    groups on real construction sites.

    **There is no staging.** Treat every project as production. Where a project has `enabled = false`
    it is safe to experiment with; anything else is live.

    The column set for each service is not fixed in this document. It is introspected from the live
    database, so new columns appear without a release. Call `getSchema` first and work from what it
    returns, including each field's widget, options, default and help text.

    **Agents:** the same operations are available over MCP at `/api/mcp` (Streamable HTTP, JSON only),
    with tools derived from this document — one tool per `operationId`, carrying safety annotations.
    That is usually the better surface; this one is the contract it is generated from.
  contact:
    name: Wenti Labs
servers:
  - url: http://localhost:5178
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: discovery
    description: What exists, and what shape it has. Start here.
  - name: configuration
    description: Read and change project configuration.
  - name: operations
    description: Trigger work on the alerting services. These have real-world effects.
  - name: onboarding
    description: Create a new project.
paths:
  /api/session:
    get:
      operationId: getSession
      tags:
        - discovery
      summary: Who am I, and what may I do
      description: Resolves the caller's credential and reports the scopes it carries. Call this first to confirm a token works and to discover whether writes are permitted, rather than discovering it from a 403 mid-task.
      responses:
        "200":
          description: The resolved identity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowed:
                    type: boolean
                  canEdit:
                    type: boolean
                    description: True when the credential may change configuration.
                  actor:
                    type: string
                    description: Recorded against every change this credential makes. An agent appears as `agent:<name>`.
                  kind:
                    type: string
                    enum:
                      - session
                      - token
                      - local-bypass
                      - none
                  scopes:
                    type: array
                    items:
                      type: string
                      enum:
                        - read
                        - write
                        - jobs
        "401": &a1
          description: "No usable credential. Send `Authorization: Bearer halo_…`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/schema:
    get:
      operationId: getSchema
      tags:
        - discovery
      summary: The editable field spec for every service
      description: Returns, per service, every column with its widget, options, default, help text and group. Introspected from the live database, so this is the authoritative shape — a column added by a migration appears here without a release. An agent should read this before writing anything, because a value that fails a column's CHECK is rejected by Postgres rather than by HALO.
      responses:
        "200":
          description: Field specs keyed by service.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": *a1
  /api/schema/reload:
    post:
      operationId: reloadSchema
      tags:
        - discovery
      summary: Discard the cached field spec
      description: Forces the next `getSchema` to re-introspect the database. Only needed immediately after a migration; the cache is otherwise harmless. Changes no data.
      responses:
        "200":
          description: Cache cleared.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": *a1
        "403": &a2
          description: Authenticated, but the credential lacks the scope this operation needs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects:
    get:
      operationId: listProjects
      tags:
        - configuration
      summary: Every project across all six services
      description: "Returns all configuration rows, keyed by service, plus a `fetchedAt` timestamp. This is a snapshot: a change made in Supabase directly is visible immediately here, but any copy you hold is stale from the moment you take it."
      responses:
        "200":
          description: All projects, keyed by service key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fetchedAt:
                    type: string
                    format: date-time
                  meta:
                    type: object
                    additionalProperties: true
                additionalProperties:
                  type: array
                  items:
                    $ref: "#/components/schemas/ProjectConfigRow"
        "401": *a1
  /api/config/{service}/{rowId}:
    patch:
      operationId: updateProjectConfig
      tags:
        - configuration
      summary: Change one project's configuration
      description: |-
        Applies a partial update to one project row. **This changes production behaviour** — the owning
        service picks the new values up on its next cron tick.

        Every change is validated against the live schema before it reaches the database, and recorded in
        `ops.config_audit` against the caller's identity. Supply a `note` saying why; it is stored with the
        change and is the only context a later reader gets.

        Pass `baseUpdatedAt` from the row you read. The write is refused with 409 if the row changed in the
        meantime, rather than silently overwriting someone else's edit.
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
            enum:
              - wbgt
              - noise
              - haze
              - lightning
              - ailytics
              - subcon
              - issueChaser
        - name: rowId
          in: path
          required: true
          schema:
            type: string
          description: "`project_code` for most services; the row `id` for Ailytics and Subcon Activities."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                changes:
                  type: object
                  additionalProperties: true
                  description: Column name to new value. Only columns the schema marks editable are accepted.
                baseUpdatedAt:
                  type:
                    - string
                    - "null"
                  format: date-time
                  description: The `updated_at` of the row you read. Omit only if you accept overwriting a concurrent change.
                note:
                  type: string
                  maxLength: 500
                  description: Why. Stored in the audit trail.
              required:
                - changes
      responses:
        "200":
          description: Applied. Returns the stored row and the effective diff.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": &a3
          description: The request was understood but is not valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401": *a1
        "403": *a2
        "404": &a4
          description: No such service, project, job or export.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The row changed since `baseUpdatedAt`. Re-read and re-apply.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/audit:
    get:
      operationId: listAudit
      tags:
        - configuration
      summary: History of configuration changes
      description: |-
        Every change to any config table, newest first, written by a Postgres trigger rather than by HALO —
        so a change made directly in Supabase is captured just as faithfully as one made here.

        `actor_email` is filled in only for changes made through HALO. A row without one was made outside it,
        and **the database does not record who**. Note also that many such rows are the services writing their
        own runtime state, not people.

        Only updates are recorded. Row creation and deletion are not.
      parameters:
        - name: service
          in: query
          schema:
            type: string
            enum:
              - wbgt
              - noise
              - haze
              - lightning
              - ailytics
              - subcon
              - issueChaser
          description: Restrict to one service's config table.
        - name: project
          in: query
          schema:
            type: string
          description: Restrict to one project — `project_code`, or the row id for Ailytics and Subcon.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: Audit entries, newest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": *a1
  /api/group-names:
    get:
      operationId: listGroupNames
      tags:
        - discovery
      summary: WhatsApp chat id to human group name
      description: Resolves the `120363…@g.us` identifiers that appear throughout the configuration into readable group names. Pass `refresh=1` to re-read them from the listener, which is slow and rarely necessary.
      parameters:
        - name: refresh
          in: query
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: Chat id to name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": *a1
  /api/noise-meters:
    get:
      operationId: listNoiseMeters
      tags:
        - discovery
      summary: Noise meters for one project
      description: Resolves a noise project's meter RecIDs to their location names. Needed to interpret or set `noise_meters_included`, which stores RecIDs rather than names.
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
          description: Project code.
      responses:
        "200":
          description: Meters for the project.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": *a1
  /api/jobs/{job}:
    post:
      operationId: runJob
      tags:
        - operations
      summary: Trigger a job on an alerting service
      description: |-
        Runs one job against one project for a date range. **Requires the `jobs` scope, which `write` does
        not confer.**

        These have real-world effects that differ per job. `wbgt-scrape` logs into CloudLynx and drives a
        browser session that can run for minutes. The sheet jobs write to Google Sheets. Read the job's
        `description` in `listJobs` before calling it, and prefer a narrow date range.

        The precondition is re-checked server-side, because every one of these jobs reports success while
        doing nothing when it is unmet.
      parameters:
        - name: job
          in: path
          required: true
          schema:
            type: string
            enum:
              - noise-bootstrap
              - noise-sync
              - wbgt-fill
              - wbgt-scrape
              - wbgt-water-parade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectCode:
                  type: string
                startDate:
                  type: string
                  format: date
                  description: YYYY-MM-DD, inclusive.
                endDate:
                  type: string
                  format: date
                  description: YYYY-MM-DD, inclusive.
                flags:
                  type: object
                  additionalProperties:
                    type: boolean
                  description: Only flags the job declares are forwarded.
              required:
                - projectCode
                - startDate
                - endDate
      responses:
        "200":
          description: The service's own response, passed through.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": *a3
        "401": *a1
        "403": *a2
        "404": *a4
        "503":
          description: The service's base URL is not configured on HALO.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/exports/{export}:
    post:
      operationId: runExport
      tags:
        - operations
      summary: Export a monitoring record as PDF or xlsx
      description: "Returns a file, or a JSON blocker list explaining why it cannot. Read-only: nothing is written and no message is sent. Send `preflight: true` to get the blockers and the available tabs without producing a file."
      parameters:
        - name: export
          in: path
          required: true
          schema:
            type: string
        - name: preflight
          in: query
          schema:
            type: string
            enum:
              - "1"
          description: Check readiness only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectCode:
                  type: string
                tab:
                  type: string
                  description: Worksheet name, where the export targets one tab.
                format:
                  type: string
                  enum:
                    - pdf
                    - xlsx
                scope:
                  type: string
                  enum:
                    - workbook
                    - tab
              required:
                - projectCode
      responses:
        "200":
          description: The file, or a readiness report when blocked.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": *a1
        "404": *a4
  /api/onboard/{service}:
    get:
      operationId: getOnboardingRequirements
      tags:
        - onboarding
      summary: What creating a project for this service needs
      description: Reports the prefilled defaults the server can supply, which environment-backed defaults are missing, and whether any prerequisite database function is installed. Call before `createProject` — WBGT cannot be onboarded at all until its readings-table function exists.
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
            enum:
              - wbgt
              - noise
              - haze
              - lightning
              - ailytics
              - subcon
              - issueChaser
      responses:
        "200":
          description: Requirements and defaults.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": *a1
        "404":
          description: This service has no onboarding flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      operationId: createProject
      tags:
        - onboarding
      summary: Create a project
      description: |-
        Creates a new project, **always disabled**. `enabled` cannot be set here; it is turned on afterwards
        through `updateProjectConfig` once the project has been verified.

        What gets created varies. Haze and Lightning are a single row. Ailytics is a row whose blank NOT NULL
        columns are stored as empty strings. WBGT creates a per-project readings table first, then the config
        row, then a sensor row.

        Some steps are outside HALO entirely — sharing a Google Sheet, deploying an adapter, matching a
        CloudLynx sensor label. The response lists them, and a project is not working until they are done.

        Note that row creation is **not** recorded in the audit trail; only later updates are.
      parameters:
        - name: service
          in: path
          required: true
          schema:
            type: string
            enum:
              - wbgt
              - noise
              - haze
              - lightning
              - ailytics
              - subcon
              - issueChaser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                draft:
                  type: object
                  additionalProperties:
                    type: string
                  description: Field values, keyed by column. Call `getOnboardingRequirements` for the field list.
              required:
                - draft
      responses:
        "200":
          description: Created. Lists what was created and what remains to be done by hand.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": *a3
        "401": *a1
        "403": *a2
        "503":
          description: A prerequisite database function is not installed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/onboard/geocode:
    get:
      operationId: geocodeAddress
      tags:
        - onboarding
      summary: Singapore address or postal code to coordinates
      description: Looks a location up through OneMap and returns candidates with coordinates. Each carries `valid`, which is false when the result falls outside the service area that Haze and Lightning enforce with a CHECK constraint — do not use an invalid candidate.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Postal code or address.
      responses:
        "200":
          description: Ranked candidates.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": *a3
        "401": *a1
        "504":
          description: OneMap did not respond in time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |-
        A token minted by `scripts/mint-api-token.mjs`, sent as `Authorization: Bearer halo_…`.

        Scopes are additive and **not** hierarchical: `read` permits reads, `write` permits configuration
        changes, `jobs` permits triggering jobs. Holding `write` does not confer `read`, and neither confers
        `jobs`. Call `getSession` to see what a token actually carries.

        Every change a token makes is attributed to `agent:<name>` in the audit trail.
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem detail. Branch on `title`, not on prose.
      properties:
        error:
          type: string
          description: Human-readable explanation of what went wrong.
      required:
        - error
    ProjectConfigRow:
      type: object
      additionalProperties: true
      description: One project's live configuration. Columns vary by service and are discovered from the database at runtime — call `getSchema` to learn the shape rather than assuming it.
