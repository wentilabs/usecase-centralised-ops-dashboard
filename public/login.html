<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Centralised Services</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🗂️</text></svg>">
<style>
  body { display: grid; place-items: center; min-height: 100vh; }
  .login-box {
    width: min(420px, 92vw);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 28px;
  }
  .login-box h1 { font-size: 19px; margin: 0 0 6px; }
  .login-box p.sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .login-box label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
  .login-box input {
    width: 100%; padding: 10px 12px; margin-bottom: 14px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text);
  }
  .login-box button { width: 100%; }
  .msg { font-size: 13px; margin-top: 14px; }
  .msg.err { color: #dc2626; }
  .msg.ok { color: var(--on); }
  .step { display: none; }
  .step.active { display: block; }
</style>
</head>
<body>
<div class="login-box">
  <h1>🗂️ Centralised Services</h1>
  <p class="sub">Sign in with your work email to manage project configs.</p>

  <form class="step active" id="step-email">
    <label for="email">Work email</label>
    <input type="email" id="email" autocomplete="email" required placeholder="you@company.com">
    <button class="primary" type="submit">Email me a sign-in code</button>
  </form>

  <form class="step" id="step-code">
    <label for="code">6-digit code sent to <span id="sent-to"></span></label>
    <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required placeholder="123456">
    <button class="primary" type="submit">Sign in</button>
  </form>

  <div class="msg" id="msg"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const redirectTo = params.get("redirect") || "/";
if (params.get("reason") === "session_expired") say("Your session expired — sign in again.", "err");

function say(text, kind = "") { const m = $("#msg"); m.textContent = text; m.className = "msg " + kind; }

$("#step-email").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("#email").value.trim();
  say("Sending…");
  try {
    const res = await fetch("/api/auth/request-otp", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email }),
    });
    if (!res.ok) return say((await res.json()).error || "Could not send the code.", "err");
    $("#sent-to").textContent = email;
    $("#step-email").classList.remove("active");
    $("#step-code").classList.add("active");
    $("#code").focus();
    // Deliberately the same message whether or not the address is approved.
    say("If that address is approved, a code is on its way.", "ok");
  } catch (err) { say(err.message, "err"); }
});

$("#step-code").addEventListener("submit", async (e) => {
  e.preventDefault();
  say("Verifying…");
  try {
    const res = await fetch("/api/auth/verify-otp", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("#email").value.trim(), code: $("#code").value.trim() }),
    });
    const body = await res.json();
    if (!res.ok) return say(body.error || "That code was not accepted.", "err");
    location.replace(redirectTo);
  } catch (err) { say(err.message, "err"); }
});
</script>
</body>
</html>
